name: Build Zone Visuals from ZIP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP File
        run: |
          # Автоматически находим и распаковываем любой ZIP в репозитории
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Распаковка $f..."
              unzip -o "$f"
              if [ -d "zone-visuals" ]; then
                cp -r zone-visuals/* .
              fi
            fi
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: zone-visuals-1.21.4
          path: build/libs/*.jar
